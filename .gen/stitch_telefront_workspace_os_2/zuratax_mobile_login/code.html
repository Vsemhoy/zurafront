<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface flex items-center justify-center h-full focus:outline-none" onclick="togglePassword()" type="button">

<span class="font-body-sm text-body-sm">Docs</span>

</span>
<span class="font-data-mono text-data-mono text-on-surface-variant">All systems operational</span>
</div>

<script>
    function toggleBanner() {
        const content = document.getElementById('bannerContent');
        const chevron = document.getElementById('bannerChevron');
        const isExpanded = content.style.height && content.style.height !== '0px';
        
        if (isExpanded) {
            content.style.height = '0px';
            chevron.style.transform = 'rotate(0deg)';
        } else {
            content.style.height = content.scrollHeight + 'px';
            chevron.style.transform = 'rotate(180deg)';
        }
    }

    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.getElementById('passwordToggleIcon');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }
</script></main></body></html>
