<div class="flex flex-col flex-1 px-lg space-y-xl max-w-md mx-auto w-full">
<!-- Header / Logo -->
<header class="flex justify-between items-center w-full pt-lg">
<img alt="Zuratax Logo" class="w-12 h-12 object-contain rounded-md" src="https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg"/>
<!-- Language Selector -->
<button class="flex items-center space-x-unit bg-surface-container rounded-full px-sm py-xs text-on-surface hover:-translate-y-[1px] transition-transform duration-200 shadow-sm">
<span class="material-symbols-outlined text-[16px]">language</span>
<span class="font-title-sm text-on-surface text-[13px]">EN</span>
<span class="material-symbols-outlined text-[16px]">expand_more</span>
</button>
</header>
<!-- Release Banner -->
<div class="relative bg-surface-container-high rounded-xl overflow-hidden shadow-md group hover:-translate-y-[1px] transition-all duration-300">
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 via-transparent to-transparent pointer-events-none"></div>
<div class="flex flex-col">
<img alt="V2.1 Release Mascot" class="w-full h-32 object-cover object-center" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAO0iy1lbXCbVOxcJ6o1L2pgYnp1Jib0FrsqMCxHMapEgXe9JDAcv6psqzf4LQUoa4V7fNNsjsVeffAYSNZ8p7Ke0GeTau8K9sQMPhyHbpY7JPTKApqILlPXCw0vJqQmAsCqSHguDu0ZoUsBgc1onkvBuMuEh6AfeP7NN6sDVDZ6Q_nYPRTOBmNY2NluoN7rZARpMEdTvKkCkzDRbWAdgd401Pvg4fe6sXFI74xcYCR-fj-vAgLzp2_"/>
<div class="p-md flex items-center justify-between">
<div class="flex flex-col">
<span class="font-badge-caps text-primary tracking-widest uppercase mb-unit">New in v2.1</span>
<h2 class="font-title-sm text-on-surface">Intelligent Sorting</h2>
</div>
<button class="bg-primary/10 text-primary p-sm rounded-full group-hover:bg-primary group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</div>
<!-- Login Form Container -->
<div class="flex flex-col space-y-lg flex-1 justify-center">
<div class="text-center space-y-xs">
<h1 class="font-display-lg text-on-background">Welcome back</h1>
<p class="font-body-base text-on-surface-variant">Log in to your intelligent workspace</p>
</div>
<form class="flex flex-col space-y-md" id="loginForm" onsubmit="event.preventDefault(); this.querySelector('button[type=submit]').classList.add('opacity-80', 'scale-[0.98]'); setTimeout(() =&gt; this.querySelector('button[type=submit]').classList.remove('opacity-80', 'scale-[0.98]'), 200);">
<!-- Email Input -->
<div class="flex flex-col space-y-unit relative group">
<label class="font-caption-xs text-on-surface-variant ml-xs" for="email">Email or Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant/70 text-[20px] pointer-events-none">mail</span>
<input class="w-full h-[44px] bg-surface-container-lowest text-on-surface font-body-base rounded-lg pl-xl pr-sm border-none shadow-sm focus:ring-2 focus:ring-primary focus:outline-none transition-shadow" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col space-y-unit relative group">
<div class="flex justify-between items-end ml-xs">
<label class="font-caption-xs text-on-surface-variant" for="password">Password</label>
<a class="font-caption-xs text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant/70 text-[20px] pointer-events-none">lock</span>
<input class="w-full h-[44px] bg-surface-container-lowest text-on-surface font-body-base rounded-lg pl-xl pr-xl border-none shadow-sm focus:ring-2 focus:ring-primary focus:outline-none transition-shadow" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm text-on-surface-variant/70 hover:text-primary transition-colors p-unit" onclick="const p=document.getElementById('password'); const i=this.querySelector('span'); if(p.type==='password'){p.type='text';i.textContent='visibility_off';}else{p.type='password';i.textContent='visibility';}" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-[44px] mt-sm bg-primary text-on-primary font-title-sm rounded-lg shadow-md hover:shadow-lg active:-translate-y-[1px] active:shadow-sm transition-all duration-200 flex items-center justify-center space-x-sm" type="submit">
<span>Log in to Workspace</span>
<span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- SSO / Alternative -->
<div class="flex flex-col items-center pt-md space-y-md">
<div class="flex items-center w-full">
<div class="flex-1 h-px bg-surface-variant"></div>
<span class="px-sm font-caption-xs text-on-surface-variant uppercase tracking-wider">Or continue with</span>
<div class="flex-1 h-px bg-surface-variant"></div>
</div>
<button class="w-full h-[44px] bg-surface-container text-on-surface font-title-sm rounded-lg shadow-sm hover:bg-surface-container-high transition-colors flex items-center justify-center space-x-sm">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
<span>Single Sign-On (SSO)</span>
</button>
</div>
</div>
<!-- Footer Links -->
<footer class="flex flex-col items-center justify-end pb-lg space-y-unit mt-auto">
<div class="flex space-x-md">
<a class="font-caption-xs text-on-surface-variant hover:text-primary transition-colors py-sm px-xs" href="#">Privacy</a>
<a class="font-caption-xs text-on-surface-variant hover:text-primary transition-colors py-sm px-xs" href="#">Terms</a>
<a class="font-caption-xs text-on-surface-variant hover:text-primary transition-colors py-sm px-xs" href="#">System Status</a>
</div>
<span class="font-caption-xs text-on-surface-variant/50">Zuratax Inc. © 2024</span>
</footer>
</div>
</div></main></body></html>
