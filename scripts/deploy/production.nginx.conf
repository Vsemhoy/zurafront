server {
    listen 127.0.0.1:8080;
    server_name zuratax.com www.zuratax.com;
    root /var/www/zuratax/current/frontend/dist;
    index index.html;
    client_max_body_size 64m;

    location ^~ /api {
        root /var/www/zuratax/current/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /storage/ {
        alias /var/www/zuratax/shared/storage/app/public/;
        try_files $uri =404;
    }

    location ~ ^/index\.php$ {
        root /var/www/zuratax/current/backend/public;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param LARAVEL_STORAGE_PATH /var/www/zuratax/shared/storage;
        fastcgi_param REPORTS_ROOT /var/www/zuratax/shared/reports;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }
}
